x-logging: &loki-logging
  driver: json-file
  options:
    tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"

services:
  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki/loki-config.yaml:/mnt/config/loki-config.yaml
    command: -config.file=/mnt/config/loki-config.yaml
    logging: *loki-logging

  promtail:
    image: grafana/promtail:3.0.0
    volumes:
      - ./config/loki/promtail-config.yaml:/mnt/config/promtail-config.yaml
      - /var/lib/docker/containers:/host/containers
    command: -config.file /mnt/config/promtail-config.yaml
    logging: *loki-logging

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning/:/etc/grafana/provisioning/
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-testloki}
    logging: *loki-logging

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    logging: *loki-logging

  tempo:
    image: grafana/tempo:2.4.1
    command: -config.file=/etc/tempo.yml
    ports:
      - "3200:3200" # HTTP API
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes:
      - ./config/tempo/tempo.yml:/etc/tempo.yml
      - tempo-data:/var/tempo
    logging: *loki-logging

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-passw123}
      POSTGRES_DB: ${POSTGRES_DB:-messages_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-messages_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *loki-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    logging: *loki-logging

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: 'rabbitmq'
    ports:
      - 5672:5672
      - 15672:15672
      - 15692:15692  # Prometheus metrics port
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - ~/.docker-conf/rabbitmq/data/:/var/lib/rabbitmq/
      - ~/.docker-conf/rabbitmq/log/:/var/log/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-passw123}

  api-rest:
    build:
      context: .
      dockerfile: services/messaging-demo/Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-passw123}
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-messages_db}
      - TEMPO_ENDPOINT=http://tempo:4317
    restart: on-failure
    logging: *loki-logging

  consumer:
    build:
      context: .
      dockerfile: services/messaging-demo/Dockerfile
    command: [ "python", "consumer.py" ]
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-passw123}
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-messages_db}
      - TEMPO_ENDPOINT=http://tempo:4317
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq
    restart: on-failure
    logging: *loki-logging

  task-consumer:
    build:
      context: .
      dockerfile: services/messaging-demo/Dockerfile
    command: [ "python", "task_consumer.py" ]
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-passw123}
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-messages_db}
      - TEMPO_ENDPOINT=http://tempo:4317
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq
    restart: on-failure
    logging: *loki-logging

  api-gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - catalog
      - cart
      - order
      - payment
      - api-rest
    logging: *loki-logging

  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-passw123}
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=catalog_db
      - TEMPO_ENDPOINT=http://tempo:4317
    restart: on-failure
    logging: *loki-logging

  payment:
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-passw123}
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=payment_db
      - PAYMENT_FAILURE_RATE=0.2
      - TEMPO_ENDPOINT=http://tempo:4317
    restart: on-failure
    logging: *loki-logging

  cart:
    build:
      context: .
      dockerfile: services/cart/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      catalog:
        condition: service_started
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-passw123}
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=cart_db
      - CATALOG_URL=http://catalog:5000
      - TEMPO_ENDPOINT=http://tempo:4317
    restart: on-failure
    logging: *loki-logging

  order:
    build:
      context: .
      dockerfile: services/order/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      cart:
        condition: service_started
      payment:
        condition: service_started
      catalog:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-passw123}
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=order_db
      - CART_URL=http://cart:5000
      - PAYMENT_URL=http://payment:5000
      - CATALOG_URL=http://catalog:5000
      - RABBITMQ_HOST=rabbitmq
      - TEMPO_ENDPOINT=http://tempo:4317
    restart: on-failure
    logging: *loki-logging

  invoice-worker:
    build:
      context: .
      dockerfile: services/invoice/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-passw123}
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=invoice_db
      - RABBITMQ_HOST=rabbitmq
      - TEMPO_ENDPOINT=http://tempo:4317
    restart: on-failure
    logging: *loki-logging

  logistics-worker:
    build:
      context: .
      dockerfile: services/logistics/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-passw123}
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=logistics_db
      - RABBITMQ_HOST=rabbitmq
      - TEMPO_ENDPOINT=http://tempo:4317
    restart: on-failure
    logging: *loki-logging

  warranty-worker:
    build:
      context: .
      dockerfile: services/warranty/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      catalog:
        condition: service_started
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-passw123}
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=warranty_db
      - RABBITMQ_HOST=rabbitmq
      - CATALOG_URL=http://catalog:5000
      - TEMPO_ENDPOINT=http://tempo:4317
    restart: on-failure
    logging: *loki-logging

volumes:
  grafana-data:
  tempo-data:
  postgres-data:
  rabbitmq-data:
  rabbitmq-log:

