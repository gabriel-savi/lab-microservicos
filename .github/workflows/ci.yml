name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint (sintaxe Python + compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validar sintaxe Python
        run: |
          python -m compileall -q shared/lab_common services || exit 1

      - name: Validar docker-compose (config)
        run: |
          docker compose config > /dev/null

  build:
    name: Build das imagens dos serviços
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build das imagens (sem subir)
        run: |
          docker compose build \
            catalog cart order payment \
            invoice-worker logistics-worker warranty-worker \
            api-rest consumer task-consumer

  smoke:
    name: Smoke test end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Subir a stack
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: Aguardar health do gateway
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/health && break
            sleep 2
          done

      - name: Smoke test (fluxo catálogo → carrinho → pedido)
        run: |
          chmod +x scripts/*.sh
          ./scripts/smoke_test.sh

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --tail=100