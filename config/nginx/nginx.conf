worker_processes auto;
events { worker_connections 1024; }

http {
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    upstream catalog { server catalog:5000; }
    upstream cart { server cart:5000; }
    upstream order { server order:5000; }
    upstream payment { server payment:5000; }
    upstream messaging { server api-rest:5000; }

    server {
        listen 8080;

        add_header X-Correlation-ID $request_id always;

        location /catalogo/ {
            rewrite ^/catalogo/(.*)$ /$1 break;
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://catalog;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        location /carrinho/ {
            rewrite ^/carrinho/(.*)$ /$1 break;
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://cart;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        location /pedidos/ {
            rewrite ^/pedidos/(.*)$ /$1 break;
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://order;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        location /pagamentos/ {
            rewrite ^/pagamentos/(.*)$ /$1 break;
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://payment;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        location /mensagens/ {
            rewrite ^/mensagens/(.*)$ /$1 break;
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://messaging;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        location / {
            proxy_pass http://order;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}
